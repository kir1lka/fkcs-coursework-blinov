<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1230" viewBox="0 0 1900 1230">
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M9 10h2M10 9v2" stroke="#b6bfc5" stroke-width="0.9"/></pattern></defs>
<rect width="1900" height="1230" fill="white"/><rect width="1900" height="1230" fill="url(#grid)"/>
<text x="70" y="80" fill="#141414" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">Новая цепь запуска и остановки</text><text x="70" y="120" fill="#667078" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Это актуальная архитектура с вашего снимка CLK_GEN: U44A находится внутри HB4.</text>
<rect x="90" y="300" width="270" height="195" rx="0" fill="#ffffff" stroke="#141414" stroke-width="3"/><text x="225" y="286" fill="#141414" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">HB5</text><text x="225" y="530" fill="#141414" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">P_RES_GEN</text><text x="225" y="558" fill="#667078" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">S1 находится внутри блока</text><rect x="120" y="755" width="205" height="110" rx="0" fill="#ffffff" stroke="#141414" stroke-width="3"/><text x="222.5" y="741" fill="#141414" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">S_START</text><text x="222.5" y="900" fill="#141414" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">START_N</text><text x="222.5" y="928" fill="#667078" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Interactive Digital Constant</text><rect x="620" y="245" width="470" height="750" rx="0" fill="#ffffff" stroke="#141414" stroke-width="3"/><text x="855" y="231" fill="#141414" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">HB4</text><text x="855" y="1030" fill="#141414" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">CLK_GEN</text><rect x="1350" y="275" width="320" height="380" rx="0" fill="#ffffff" stroke="#141414" stroke-width="3"/><text x="1510" y="261" fill="#141414" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">HB2</text><text x="1510" y="690" fill="#141414" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">D_Counter</text><rect x="700" y="315" width="310" height="80" rx="0" fill="#f4f7f8" stroke="#141414" stroke-width="2"/><text x="855" y="351" fill="#141414" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">STOP_UNIT / AND4</text><text x="855" y="380" fill="#c12b32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Q3 · NOT_Q2 · Q1 · NOT_Q0</text><rect x="700" y="465" width="310" height="120" rx="0" fill="#f4f7f8" stroke="#141414" stroke-width="2"/><text x="855" y="507" fill="#141414" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">U44A  74AS74N</text><text x="855" y="539" fill="#7d38ad" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">D ← STOP_SIG; CLK ← CLK</text><text x="855" y="566" fill="#141414" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">/PRE ← P_RES; /CLR ← START_N</text><rect x="700" y="655" width="310" height="92" rx="0" fill="#f4f7f8" stroke="#141414" stroke-width="2"/><text x="855" y="692" fill="#141414" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">LM555 / RST</text><text x="855" y="721" fill="#14a24a" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">разрешение ← U44A /Q</text><rect x="700" y="820" width="310" height="90" rx="0" fill="#f4f7f8" stroke="#141414" stroke-width="2"/><text x="855" y="858" fill="#141414" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">74LS04</text><text x="855" y="888" fill="#14a24a" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">CLK = NOT(555 OUT)</text><path d="M855 395 V465" fill="none" stroke="#7d38ad" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M855 585 V655" fill="none" stroke="#14a24a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M855 747 V820" fill="none" stroke="#14a24a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="875" y="406" width="99.36" height="32" rx="4" fill="#ffffff" stroke="#7d38ad" stroke-width="2"/><text x="924.68" y="427.44" fill="#7d38ad" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">STOP_SIG</text><rect x="875" y="599" width="129.12" height="32" rx="4" fill="#ffffff" stroke="#14a24a" stroke-width="2"/><text x="939.56" y="620.44" fill="#14a24a" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">/Q = RUN_EN</text><path d="M1670 375 H1780 V180 H520 V355 H700" fill="none" stroke="#c12b32" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="1140" y="168" width="265.52" height="34" rx="4" fill="#ffffff" stroke="#c12b32" stroke-width="2"/><text x="1272.76" y="191.12" fill="#c12b32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Q3, NOT_Q2, Q1, NOT_Q0</text><path d="M360 395 H510 V555 H620" fill="none" stroke="#2666c8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M510 555 V215 H1270 V600 H1350" fill="none" stroke="#2666c8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="435" y="561.5" width="78.9" height="35" rx="4" fill="#ffffff" stroke="#2666c8" stroke-width="2"/><text x="474.45" y="585.46" fill="#2666c8" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">P_RES</text><path d="M325 810 H530 V805 H620" fill="none" stroke="#e98a00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="360" y="765.5" width="102.46" height="35" rx="4" fill="#ffffff" stroke="#e98a00" stroke-width="2"/><text x="411.23" y="789.46" fill="#e98a00" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">START_N</text><path d="M1010 865 H1170 V500 H1350" fill="none" stroke="#14a24a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M1170 540 H1010" fill="none" stroke="#14a24a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="1170" cy="540" r="5" fill="#14a24a" stroke="#14a24a" stroke-width="1"/><rect x="1098" y="821.5" width="55.339999999999996" height="35" rx="4" fill="#ffffff" stroke="#14a24a" stroke-width="2"/><text x="1125.67" y="845.46" fill="#14a24a" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">CLK</text><rect x="1410" y="720.5" width="304.58" height="33" rx="4" fill="#ffffff" stroke="#14a24a" stroke-width="2"/><text x="1562.29" y="742.78" fill="#14a24a" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">тот же CLK → XLA и U44A:CLK</text><text x="1380" y="335" fill="#d5252a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">D0…D3 от Logic_D</text><text x="1380" y="405" fill="#14a24a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">CLK ← HB4</text><text x="1380" y="605" fill="#2666c8" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">P_RES ← HB5</text><rect x="110" y="1030" width="1670" height="150" rx="8" fill="#ffffff" stroke="#8c9aa0" stroke-width="2"/><text x="145" y="1071" fill="#141414" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Порядок проверки</text><text x="145" y="1112" fill="#141414" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">1. START_N = 1. Включить моделирование, дождаться P_RES = 1. На HEX должно быть D.</text><text x="145" y="1149" fill="#141414" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">2. Кратко перевести START_N: 1 → 0 → 1. Через 13 фронтов CLK на HEX должно остаться 6.</text><text x="85" y="1210" fill="#667078" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Старый источник 20 Hz и старый внешний Key=1 на CLK/P_RES отсоединить. S1 в HB5 — кнопка общего сброса.</text></svg>