-size="21" font-weight="400" text-anchor="start">Пробники D3…D0 остаются на Bus1.</text><text x="1390" y="1177" fill="#667078" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Для полной диаграммы XLA: внутренний такт, C открыт.</text><text x="70" y="1385" fill="#667078" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">* В режиме проверки Y: XLA C ← CLK. В режиме остановки: C свободен, внутренняя выборка 100 Гц.</text></svg>