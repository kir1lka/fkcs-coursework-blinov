troke="#7d38ad" stroke-width="2.8" /><text x="1118" y="712" fill="#7d38ad" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">Y11</text><text x="1432" y="712" fill="#141414" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">11  Y11</text><line x1="1150" y1="747" x2="1410" y2="747" stroke="#7d38ad" stroke-width="2.8" /><text x="1118" y="754" fill="#7d38ad" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">Y12</text><text x="1432" y="754" fill="#141414" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">12  Y12</text><line x1="1150" y1="789" x2="1410" y2="789" stroke="#7d38ad" stroke-width="2.8" /><text x="1118" y="796" fill="#7d38ad" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">Y13</text><text x="1432" y="796" fill="#141414" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">13  Y13</text><line x1="1150" y1="831" x2="1410" y2="831" stroke="#7d38ad" stroke-width="2.8" /><text x="1118" y="838" fill="#7d38ad" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">Y14</text><text x="1432" y="838" fill="#141414" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">14  Y14</text><text x="1450" y="895" fill="#667078" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">15, 16 — свободны</text><text x="160" y="947" fill="#c12b32" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Q3  Q2  Q1  Q0</text><text x="510" y="957" fill="#c12b32" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">четыре отдельные линии Q → HEX</text><rect x="160" y="1135" width="1580" height="195" rx="8" fill="#f4f7f8" stroke="#a8b0b3" stroke-width="2"/><text x="195" y="1180" fill="#141414" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Два режима одного XLA1</text><text x="195" y="1222" fill="#141414" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Проверка DC: 1–14 ← Y0,Y2,…,Y14; C ← CLK; режим External (C).</text><text x="195" y="1260" fill="#141414" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Итоговая остановка: 1–4 ← Q3…Q0; 5 ← START_N; 6 ← P_RES; 7 ← STOP_SIG*; 8 ← CLK.</text><text x="195" y="1298" fill="#141414" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Для удержания после остановки: Internal 100 Hz, вход C свободен. Y6 должен остаться активным.</text><text x="160" y="1385" fill="#667078" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">* STOP_SIG находится внутри HB4: добавьте выход/контрольную точку либо оставьте канал 7 свободным.</text></svg>