<text x="70" y="80" fill="#141414" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start">Дешифратор DC и логический анализатор</text><text x="70" y="120" fill="#667078" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Точные имена выводов с вашего HB3. Каждый Y — отдельный сигнал, а не один общий провод.</text>
